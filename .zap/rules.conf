# Configuration des règles OWASP ZAP (scan baseline) — refonte-api
#
# Format : <ruleId><TAB><nom><TAB><action><TAB>(commentaire)
# Actions : PASS | IGNORE | WARN | FAIL (FAIL = bloque le pipeline)
# Les règles NON listées ici sont en WARN par défaut : elles sont remontées
# dans les rapports mais ne bloquent pas la chaîne CI/CD (le scan est lancé
# avec -I « do not return failure on warning »).
#
# Stratégie de blocage (exigence d'audit : bloquer sur CRITIQUE/ÉLEVÉ) :
#   - les règles marquées FAIL couvrent les faiblesses HTTP à fort impact que
#     l'API satisfait déjà aujourd'hui (helmet, CORS restreint, x-powered-by
#     désactivé) : toute régression bloque donc immédiatement le pipeline ;
#   - en complément, l'étape « Verrou DAST » du workflow analyse le rapport
#     JSON et échoue si une alerte de risque HIGH (riskcode >= 3) est détectée,
#     quelle que soit sa règle d'origine.

# --- En-têtes de sécurité (helmet) — régressions bloquantes ---
10020	X-Frame-Options Header Missing	FAIL	(frameguard: deny configuré côté Express)
10021	X-Content-Type-Options Header Missing	FAIL	(helmet noSniff: true)
10035	Strict-Transport-Security Header Missing	FAIL	(HSTS max-age=31536000 + preload)
10038	Content Security Policy Header Not Set	FAIL	(CSP helmet default-src 'self')
10098	Cross-Domain Misconfiguration	FAIL	(police de sous-domaines croisés)

# --- CORS & fuites d'information ---
10063	Permissive Cross Origin Resource Sharing Policy	FAIL	(cors origin = FRONTEND_URL uniquement)
10037	Server Leaks Information via "X-Powered-By" Header	FAIL	(app.disable x-powered-by)

# --- Cookies de session (refresh token) ---
10010	Cookie Without HttpOnly Flag	FAIL	(cookie refresh token httpOnly)
10011	Cookie Without Secure Flag	WARN	(Secure posé en production ; cible de scan servie en HTTP local en CI)

# --- Checks volontairement non bloquants pour cette API ---
10015	Incomplete or No Cache-control and Pragma Header Set	WARN	(/api en no-store ; les fichiers /uploads restent servis statiquement)
10017	Anti-CSRF Tokens Check	WARN	(formulaires publics en JSON sans cookie d'état ; auth par JWT + cookie SameSite)
10062	Verbose Error Messages	WARN	(les 400 métier exposent volontairement les messages de validation ; les 500 sont génériques)
