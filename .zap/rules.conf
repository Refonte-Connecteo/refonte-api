# Configuration des règles OWASP ZAP (scan baseline) — refonte-api
#
# Format : <ruleId><TAB><nom><TAB><action><TAB>(commentaire)
# Actions : PASS | IGNORE | WARN | FAIL (FAIL = bloque le pipeline)
# Les règles NON listées ici sont en WARN par défaut : elles sont remontées
# dans les rapports mais ne bloquent pas la chaîne CI/CD (le scan est lancé
# avec -I « do not return failure on warning »).
#
# Stratégie de blocage (exigence d'audit : bloquer sur CRITIQUE/ÉLEVÉ) :
#   - les règles marquées FAIL couvrent les faiblesses HTTP à fort impact que
#     l'API satisfait déjà aujourd'hui (helmet, CORS restreint, x-powered-by
#     désactivé) : toute régression bloque donc immédiatement le pipeline ;
#   - en complément, l'étape « Verrou DAST » du workflow analyse le rapport
#     JSON et échoue si une alerte de risque HIGH (riskcode >= 3) est détectée,
#     quelle que soit sa règle d'origine.

# --- En-têtes de sécurité (helmet) — régressions bloquantes ---
10020	FAIL	(X-Frame-Options Header Missing — frameguard: deny configuré côté Express)
10021	FAIL	(X-Content-Type-Options Header Missing — helmet noSniff: true)
10035	FAIL	(Strict-Transport-Security Header Missing — HSTS max-age=31536000 + preload)
10038	FAIL	(Content Security Policy Header Not Set — CSP helmet default-src 'self')
10098	FAIL	(Cross-Domain Misconfiguration — police de sous-domaines croisés)

# --- CORS & fuites d'information ---
10063	FAIL	(Permissive Cross Origin Resource Sharing Policy — cors origin = FRONTEND_URL uniquement)
10037	FAIL	(Server Leaks Information via "X-Powered-By" Header — app.disable x-powered-by)

# --- Cookies de session (refresh token) ---
10010	FAIL	(Cookie Without HttpOnly Flag — cookie refresh token httpOnly)
10011	WARN	(Cookie Without Secure Flag — Secure posé en production ; cible de scan servie en HTTP local en CI)

# --- Checks volontairement non bloquants pour cette API ---
10015	WARN	(Incomplete or No Cache-control and Pragma Header Set — /api en no-store ; les fichiers /uploads restent servis statiquement)
10017	WARN	(Anti-CSRF Tokens Check — formulaires publics en JSON sans cookie d'état ; auth par JWT + cookie SameSite)
10062	WARN	(Verbose Error Messages — les 400 métier exposent volontairement les messages de validation ; les 500 sont génériques)
