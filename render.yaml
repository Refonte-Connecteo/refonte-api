services:
  - type: web
    name: refonte-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: connecteo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
        type: raw_salt
      - key: ENCRYPTION_KEY
        generateValue: true
        type: raw_salt
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 3000

databases:
  - name: connecteo-db
    plan: free
    databaseName: connecteo
    ipAllowList: []
